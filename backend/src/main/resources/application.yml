# =====================================================================
# Configuration commune à tous les environnements.
# Les valeurs ${...} sans valeur par défaut sont OBLIGATOIRES :
# l'application refuse de démarrer si elles sont absentes.
# Profils : dev (poste développeur), test (tests automatisés), prod.
# =====================================================================
spring:
  application:
    name: plateforme-api
  threads:
    virtual:
      enabled: true                       # Java 21 : threads virtuels pour les requêtes HTTP
  servlet:
    multipart:
      max-file-size: 5MB                  # import Excel des élèves
      max-request-size: 6MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}                  # rôle applicatif SANS BYPASSRLS (soumis à la RLS)
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      connection-timeout: 3000
  jpa:
    open-in-view: false                   # aucune requête hors transaction (indispensable pour la RLS)
    hibernate:
      ddl-auto: none                      # le schéma est géré uniquement par Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    user: ${FLYWAY_USER}                  # rôle propriétaire du schéma (BYPASSRLS)
    password: ${FLYWAY_PASSWORD}
    locations: classpath:db/migration
    placeholders:
      app_role: ${DB_USER}
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework     # derrière le reverse proxy (X-Forwarded-*)
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db      # jamais les services externes (SMS, Mobile Money)
  info:
    env:
      enabled: true

info:
  application:
    nom: Plateforme SaaS de gestion des établissements secondaires
    version: '@project.version@'

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  plateforme:
    indicatif-telephone: "+226"
  securite:
    jwt-secret: ${JWT_SECRET}             # Base64, 32 octets minimum : openssl rand -base64 48
    emetteur: ${JWT_EMETTEUR:https://api.plateforme.bf}
    duree-jeton-acces: 15m
    duree-jeton-selection: 5m
    duree-jeton-rafraichissement: 30d
    verifier-sous-domaine: ${VERIFIER_SOUS_DOMAINE:false}
    cookie-securise: true
    origines-autorisees: ${ORIGINES_AUTORISEES:}
    max-echecs-connexion: 5
    duree-verrouillage: 15m
    grace-rafraichissement: 20s           # réponse de renouvellement perdue : l'ancien cookie reste valable une fois
  notifications:
    envoi-automatique: ${NOTIFICATIONS_ENVOI_AUTOMATIQUE:true}
    intervalle-ms: 10000                  # passage du worker d'envoi des SMS
    taille-lot: 50
    bail: 2m                              # réservation d'un message par une instance
    max-tentatives: 6                     # 2, 4, 8, 16, 32 minutes entre les tentatives
    seuil-coupe-circuit: 5                # échecs consécutifs avant suspension
    pause-coupe-circuit: 5m
  enseignants:
    cron-fins: "0 15 0 * * *"             # chaque nuit à 0 h 15 : clôture des engagements échus
  scolarite:
    relances-automatiques: ${RELANCES_AUTOMATIQUES:true}
    cron-relances: "0 30 7 * * MON"       # chaque lundi à 7 h 30, heure de Ouagadougou
  mobile-money:
    cle-chiffrement: ${MOBILE_MONEY_CLE_CHIFFREMENT:}   # openssl rand -base64 32 ; vide : Mobile Money inactif
    duree-validite: 15m                   # délai laissé au parent pour confirmer
    taches-automatiques: true             # expiration (chaque minute) et rapprochement (2 h 30)
    simulateur-autorise: false
    cron-rapprochement: "0 30 2 * * *"
  exports:
    repertoire: ${EXPORTS_REPERTOIRE:${java.io.tmpdir}/plateforme-exports}   # volume persistant en production
    duree-conservation: 7d                # archive téléchargeable 7 jours, puis effacée
    duree-max: 1h                         # au-delà, une préparation est considérée comme interrompue
    duree-lien: 10m                       # validité d'un lien de téléchargement
    max-par-jour: 5                       # exports par établissement et par 24 heures
    purge-automatique: true
  amorcage:
    super-admin-telephone: ${SUPER_ADMIN_TELEPHONE:}
    super-admin-mot-de-passe: ${SUPER_ADMIN_MOT_DE_PASSE:}
    super-admin-nom: ${SUPER_ADMIN_NOM:}
    super-admin-prenoms: ${SUPER_ADMIN_PRENOMS:}

logging:
  level:
    root: INFO
